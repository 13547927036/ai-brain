<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>哈气猫</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0a0e;
      overflow: hidden;
      /* 竖屏：禁止下拉刷新与长按选择 */
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      display: block;
      touch-action: none;
      /* 居中留黑边，保证 750x1334 完整可见 */
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      image-rendering: auto;
    }
    #hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 8px;
      text-align: center;
      font: 12px ui-monospace, Consolas, monospace;
      color: #3a3a4a;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hint">WASD / 方向键移动 · 也可以按住画面拖动</div>
  <script>
    // 全局错误捕获。同时写进 document.body.dataset.error，
    // 因为浏览器自动化的 eval 跑在隔离 JS 世界里，读不到 window 上的变量，但 DOM 是共享的。
    window.__errors = [];
    function __recordError(msg) {
      window.__errors.push(msg);
      try {
        document.body.dataset.error = String(msg).slice(0, 400);
        document.body.dataset.errorCount = String(window.__errors.length);
      } catch (_) { /* body 可能还不存在 */ }
    }
    window.addEventListener('error', function (e) {
      __recordError((e && e.message) || e);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      __recordError('promise: ' + ((e && e.reason && e.reason.message) || (e && e.reason) || e));
    });
  </script>
  <script type="module" src="/dist/app/main.js"></script>
</body>
</html>
