<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>项目复盘</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f7;min-height:100vh;padding:16px}
        .container{max-width:500px;margin:0 auto}
        .auth-container{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px}
        .auth-card{background:#fff;border-radius:16px;padding:32px 24px;width:100%;max-width:400px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
        .auth-title{font-size:24px;font-weight:700;color:#1d1d1f;text-align:center;margin-bottom:8px}
        .auth-subtitle{font-size:14px;color:#86868b;text-align:center;margin-bottom:32px}
        .auth-input{width:100%;padding:14px 16px;background:#f5f5f7;border:2px solid transparent;border-radius:12px;font-size:15px;margin-bottom:12px}
        .auth-input:focus{outline:none;border-color:#007aff;background:#fff}
        .auth-btn{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;margin-bottom:12px}
        .auth-btn:active{transform:scale(0.98);opacity:0.8}
        .auth-btn-primary{background:#007aff;color:#fff}
        .auth-btn-secondary{background:#f0f0f5;color:#1d1d1f}
        .auth-divider{display:flex;align-items:center;margin:20px 0;color:#86868b;font-size:13px}
        .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:#e0e0e5}
        .auth-divider span{padding:0 12px}
        .auth-toggle{text-align:center;font-size:14px;color:#86868b}
        .auth-toggle a{color:#007aff;text-decoration:none;font-weight:600;cursor:pointer}
        .auth-error{background:#ffebeb;color:#ff3b30;padding:12px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:center}
        .auth-success{background:#e8f5e9;color:#2e7d32;padding:12px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:center}
        .hidden{display:none!important}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;position:sticky;top:0;background:#f5f5f7;padding:16px 0;z-index:50}
        .tabs{display:flex;gap:8px;margin-bottom:16px;position:sticky;top:60px;background:#f5f5f7;padding:8px 0;z-index:50}
        .game-selector{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;padding:8px 16px;border-radius:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
        .game-selector:hover{background:#f0f0f5}
        .game-title{font-size:1.1rem;color:#1d1d1f;font-weight:600}
        .settings-btn,.back-btn,.logout-btn{cursor:pointer;padding:8px;color:#1d1d1f}
        .settings-btn:hover,.back-btn:hover,.logout-btn:hover{opacity:0.6}
        .card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
        .btn{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.2s}
        .btn:active{transform:scale(0.98);opacity:0.8}
        .btn-primary{background:#007aff;color:#fff}
        .btn-success{background:#34c759;color:#fff}
        .btn-danger{background:#ffebeb;color:#ff3b30}
        .btn-secondary{background:#f0f0f5;color:#1d1d1f}
        .tags{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
        .option-btn{padding:14px;border-radius:12px;background:#f0f0f5;color:#1d1d1f;font-size:14px;font-weight:500;cursor:pointer;border:none;text-align:center;transition:all 0.2s}
        .option-btn:active{background:#007aff;color:#fff;transform:scale(0.98)}
        .tag-manager-item{background:#f8f8fa;border-radius:12px;padding:14px;margin-bottom:12px}
        .tag-manager-delete{background:none;color:#ff3b30;border:none;padding:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .tag-manager-delete:hover{opacity:0.6}
        .game-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#f8f8fa;border-radius:12px;cursor:pointer;transition:all 0.2s}
        .game-item:hover{background:#f0f0f5}
        .game-item.active{background:#007aff;color:#fff}
        .game-item-name{font-size:15px;font-weight:600}
        .add-game-row{display:flex;gap:8px}
        .add-game-input{flex:1;padding:12px 16px;background:#f8f8fa;border:2px solid transparent;border-radius:12px;font-size:14px}
        .add-game-input:focus{outline:none;border-color:#007aff}
        .add-game-btn{padding:12px;background:#007aff;color:#fff;border:none;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .records{max-height:400px;overflow-y:auto}
        .record{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:10px;background:#f8f8fa;min-height:56px}
        .record-result{font-weight:600;font-size:14px;line-height:1.4}
        .record-time{font-size:11px;color:#c7c7cc;white-space:nowrap;line-height:1.4}
        .bar-chart{margin-top:10px;position:relative;height:250px}
        .modal-overlay,.confirm-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;align-items:center;justify-content:center}
        .modal-overlay.active,.confirm-overlay.active{display:flex}
        .modal{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto}
        .modal-title{font-size:18px;font-weight:600;color:#1d1d1f;margin-bottom:16px;text-align:center}
        .game-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
        .close-modal{margin-top:16px;background:#f0f0f5;color:#1d1d1f}
        .confirm-modal{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:320px}
        .confirm-message{font-size:15px;color:#1d1d1f;margin-bottom:20px;text-align:center}
        .confirm-buttons{display:flex;gap:12px}
        .confirm-buttons .btn{flex:1}
        .settings-page{display:none}
        .settings-page.active{display:block}
        .tab{flex:1;padding:12px;text-align:center;background:#fff;border-radius:10px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
        .tab.active{background:#007aff;color:#fff}
        .section-title{font-size:14px;color:#86868b;margin-bottom:16px}
        .empty{text-align:center;padding:30px;color:#c7c7cc}
        .icon{width:20px;height:20px}
        .icon-sm{width:16px;height:16px}
    </style>
</head>
<body>
    <div id="authPage" class="auth-container hidden">
        <div class="auth-card">
            <h1 class="auth-title">项目复盘</h1>
            <p class="auth-subtitle">登录以同步你的数据</p>
            <div id="authError" class="auth-error hidden"></div>
            <div id="authSuccess" class="auth-success hidden"></div>
            <div id="loginForm">
                <input type="email" id="loginEmail" class="auth-input" placeholder="邮箱" />
                <input type="password" id="loginPassword" class="auth-input" placeholder="密码" />
                <button class="auth-btn auth-btn-primary" onclick="handleLogin()">登录</button>
                <div class="auth-toggle">没有账号？<a onclick="showSignup()">注册</a></div>
            </div>
            <div id="signupForm" class="hidden">
                <input type="email" id="signupEmail" class="auth-input" placeholder="邮箱" />
                <input type="password" id="signupPassword" class="auth-input" placeholder="密码（至少 6 位）" />
                <button class="auth-btn auth-btn-primary" onclick="handleSignup()">注册</button>
                <div class="auth-toggle">已有账号？<a onclick="showLogin()">登录</a></div>
            </div>
            <div class="auth-divider"><span>或</span></div>
            <button class="auth-btn auth-btn-secondary" onclick="handleGuestLogin()">先随便看看</button>
        </div>
    </div>
    
    <div id="appPage" class="container">
        <div class="header">
            <div class="settings-btn" onclick="showSettings()"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg></div>
            <div class="game-selector" onclick="showGameModal()"><span class="game-title" id="currentGameTitle">项目复盘</span><svg class="game-icon icon-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
            <div class="logout-btn" onclick="handleLogout()"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></div>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('record')"><svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>记录</div>
            <div class="tab" onclick="switchTab('stats')"><svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>统计</div>
        </div>
        <div id="recordTab">
            <div class="card"><div class="section-title">选择选项</div><div class="tags" id="optionButtons"></div></div>
            <div class="card"><div class="section-title">最近记录</div><div class="records" id="recentRecords"></div></div>
        </div>
        <div id="statsTab" style="display:none;">
            <div class="card" id="chartCard"><div class="section-title">选项分布</div><div class="bar-chart"><canvas id="reasonChart"></canvas></div></div>
            <div class="card"><div class="section-title">全部记录</div><div class="records" id="allRecords"></div></div>
            <button class="btn btn-danger" onclick="clearAll()"><svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>清空当前项目数据</button>
        </div>
        <div id="settingsPage" class="settings-page">
            <div class="header">
                <div class="back-btn" onclick="showRecord()"><svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></div>
                <div class="title" style="font-size:18px;font-weight:600">设置</div>
                <div style="width:36px;"></div>
            </div>
            <div class="card">
                <div class="section-title">管理选项</div>
                <div id="tagManager"></div>
                <div style="display:flex;gap:8px;margin-top:12px">
                    <input type="text" id="newOptionInput" placeholder="添加选项..." style="flex:1;padding:12px;border:2px solid #e0e0e5;border-radius:10px;font-size:14px" onkeypress="if(event.key==='Enter')addOption(this)" />
                    <button class="btn btn-success" onclick="addOption(document.getElementById('newOptionInput'))" style="padding:12px 20px">添加</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="gameModal">
        <div class="modal">
            <div class="modal-title">选择项目</div>
            <div class="game-list" id="gameList"></div>
            <div class="add-game-row">
                <input type="text" class="add-game-input" id="newGameInput" placeholder="输入名称..." oninput="checkInput()" />
                <button class="add-game-btn" onclick="addGame()" id="addGameBtn" style="display:none"><svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></button>
            </div>
            <button class="btn close-modal" onclick="closeGameModal()">关闭</button>
        </div>
    </div>
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-modal">
            <div class="confirm-message" id="confirmMessage">确定要删除吗？</div>
            <div class="confirm-buttons">
                <button class="btn btn-secondary" onclick="closeConfirm()">取消</button>
                <button class="btn btn-danger" id="confirmBtn">删除</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kzqahvmyqywgqynqkzri.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ziV-a2GKKBQgxt1luaO_cQ_iD1OMWOx';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let currentUser = null;
        let games = [];
        let currentGameId = null;
        let currentGameName = '项目复盘';
        let gameTags = {};
        let gameRecords = {};
        let chartInstance = null;
        
        function showAuth() { document.getElementById('authPage').classList.remove('hidden'); document.getElementById('appPage').classList.add('hidden'); }
        function showApp() { document.getElementById('authPage').classList.add('hidden'); document.getElementById('appPage').classList.remove('hidden'); init(); }
        
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) { showAuthError('请填写邮箱和密码'); return; }
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) { showAuthError(error.message); }
            else { currentUser = data.user; showAuthSuccess('登录成功！'); setTimeout(() => showApp(), 500); }
        }
        
        async function handleSignup() {
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            if (!email || !password) { showAuthError('请填写邮箱和密码'); return; }
            if (password.length < 6) { showAuthError('密码至少 6 位'); return; }
            const { data, error } = await sb.auth.signUp({ email, password });
            if (error) { showAuthError(error.message); }
            else { showAuthSuccess('注册成功！请检查邮箱验证链接'); setTimeout(() => showLogin(), 2000); }
        }
        
        function handleGuestLogin() { currentUser = { is_guest: true, id: 'guest' }; showApp(); }
        
        async function handleLogout() {
            if (!currentUser?.is_guest) { await sb.auth.signOut(); }
            currentUser = null;
            showAuth();
        }
        
        function showAuthError(msg) { const el = document.getElementById('authError'); el.textContent = msg; el.classList.remove('hidden'); }
        function showAuthSuccess(msg) { const el = document.getElementById('authSuccess'); el.textContent = msg; el.classList.remove('hidden'); }
        function showLogin() { document.getElementById('loginForm').classList.remove('hidden'); document.getElementById('signupForm').classList.add('hidden'); }
        function showSignup() { document.getElementById('loginForm').classList.add('hidden'); document.getElementById('signupForm').classList.remove('hidden'); }
        
        async function init() {
            await loadGames();
            if (games.length === 0) { await createDefaultGame(); }
            else { const savedId = localStorage.getItem('currentGameId'); const game = games.find(g => g.id == savedId) || games[0]; currentGameId = game.id; currentGameName = game.name; }
            updateGameTitle();
            await loadCurrentData();
            renderTags();
            renderRecords();
        }
        
        async function loadGames() {
            if (currentUser?.is_guest) { games = JSON.parse(localStorage.getItem('guest_games') || '[]'); return; }
            const { data, error } = await sb.from('games').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
            games = error ? [] : (data || []);
        }
        
        async function createDefaultGame() {
            const gameData = { name: '项目复盘', user_id: currentUser?.is_guest ? 'guest' : currentUser.id };
            if (currentUser?.is_guest) { 
                games = [gameData]; 
                localStorage.setItem('guest_games', JSON.stringify(games)); 
                currentGameId = 'guest_default'; 
                currentGameName = '项目复盘';
                // 添加默认选项
                const defaultOptions = [
                    { id: 1, name: '枪法差' },
                    { id: 2, name: '意识差' },
                    { id: 3, name: '配合差' },
                    { id: 4, name: '战术问题' },
                    { id: 5, name: '装备问题' },
                    { id: 6, name: '心态问题' },
                    { id: 7, name: '网络/硬件' }
                ];
                gameTags[currentGameId] = [{ id: 'default', name: '默认', options: defaultOptions }];
                localStorage.setItem(`guest_tags_${currentGameId}`, JSON.stringify(gameTags[currentGameId]));
            }
            else {
                const { data, error } = await sb.from('games').insert([gameData]).select().single();
                if (error) { currentGameId = 'default'; currentGameName = '项目复盘'; }
                else { currentGameId = data.id; currentGameName = data.name; await loadGames(); }
            }
        }
        
        async function loadCurrentData() {
            if (!currentGameId || currentGameId.startsWith('guest_') || currentGameId === 'default') {
                // 游客模式默认选项
                if (currentUser?.is_guest && !gameTags[currentGameId]) {
                    const defaultOptions = [
                        { id: 1, name: '枪法差' },
                        { id: 2, name: '意识差' },
                        { id: 3, name: '配合差' },
                        { id: 4, name: '战术问题' },
                        { id: 5, name: '装备问题' },
                        { id: 6, name: '心态问题' },
                        { id: 7, name: '网络/硬件' }
                    ];
                    gameTags[currentGameId] = [{ id: 'default', name: '默认', options: defaultOptions }];
                }
                return;
            }
            if (currentUser?.is_guest) {
                gameTags[currentGameId] = JSON.parse(localStorage.getItem(`guest_tags_${currentGameId}`) || '[]');
                gameRecords[currentGameId] = JSON.parse(localStorage.getItem(`guest_records_${currentGameId}`) || '[]').map(r => ({ id: r.id, tag: r.tag_name, reason: r.option_name, time: formatDate(r.created_at) }));
                return;
            }
            const { data: tagsData } = await sb.from('tags').select('*, options(*)').eq('game_id', currentGameId);
            gameTags[currentGameId] = tagsData || [];
            const { data: recordsData } = await sb.from('records').select('*').eq('game_id', currentGameId).order('created_at', { ascending: false }).limit(100);
            gameRecords[currentGameId] = (recordsData || []).map(r => ({ id: r.id, tag: r.tag_name, reason: r.option_name, time: formatDate(r.created_at) }));
        }
        
        function formatDate(isoString) { const d = new Date(isoString); const months = ['1 月','2 月','3 月','4 月','5 月','6 月','7 月','8 月','9 月','10 月','11 月','12 月']; return `${months[d.getMonth()]}${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
        function updateGameTitle() { document.getElementById('currentGameTitle').textContent = currentGameName; }
        
        function renderTags() {
            const tags = gameTags[currentGameId] || [];
            const container = document.getElementById('optionButtons');
            const allOptions = [];
            tags.forEach(tag => { if (tag.options && tag.options.length > 0) { tag.options.forEach(opt => allOptions.push({ id: opt.id, name: opt.name, tag_id: tag.id })); } });
            if (allOptions.length === 0) { container.innerHTML = '<div style="color:#86868b;padding:20px;text-align:center">暂无选项<br/><span style="font-size:12px">去设置页添加</span></div>'; return; }
            container.innerHTML = allOptions.map(opt => `<button class="option-btn" onclick="selectOption(${opt.id}, '${opt.name}', '${opt.tag_id}')">${opt.name}</button>`).join('');
        }
        
        function renderTagManager() {
            const tags = gameTags[currentGameId] || [];
            const container = document.getElementById('tagManager');
            const allOptions = [];
            tags.forEach(tag => { if (tag.options && tag.options.length > 0) { tag.options.forEach(opt => allOptions.push({ id: opt.id, name: opt.name })); } });
            if (allOptions.length === 0) { container.innerHTML = '<div style="color:#86868b;padding:20px;text-align:center">暂无选项</div>'; return; }
            container.innerHTML = allOptions.map(opt => `<div class="tag-manager-item" style="display:flex;align-items:center;justify-content:space-between"><span style="font-weight:500">${opt.name}</span><button class="tag-manager-delete" onclick="deleteOption(${opt.id})"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>`).join('');
        }
        
        async function deleteOption(id) {
            if (currentUser?.is_guest) { const tags = gameTags[currentGameId] || []; tags.forEach(tag => { if (tag.options) tag.options = tag.options.filter(opt => opt.id !== id); }); gameTags[currentGameId] = tags; localStorage.setItem(`guest_tags_${currentGameId}`, JSON.stringify(tags)); renderTagManager(); renderTags(); return; }
            await sb.from('options').delete().eq('id', id);
            await loadCurrentData(); renderTagManager(); renderTags();
        }
        
        async function addOption(input) {
            const value = input.value.trim(); if (!value) return;
            if (currentUser?.is_guest) {
                const tags = gameTags[currentGameId] || [];
                if (tags.length === 0) { tags.push({ id: 'default', name: '默认', options: [{ id: Date.now(), name: value }] }); }
                else { if (!tags[0].options) tags[0].options = []; tags[0].options.push({ id: Date.now(), name: value }); }
                gameTags[currentGameId] = tags; localStorage.setItem(`guest_tags_${currentGameId}`, JSON.stringify(tags)); input.value = ''; renderTagManager(); renderTags(); return;
            }
            const tags = gameTags[currentGameId] || [];
            let tagId;
            if (tags.length === 0) { const { data } = await sb.from('tags').insert([{ game_id: currentGameId, name: '默认' }]).select().single(); tagId = data.id; }
            else { tagId = tags[0].id; }
            await sb.from('options').insert([{ tag_id: tagId, name: value }]);
            input.value = ''; await loadCurrentData(); renderTagManager(); renderTags();
        }
        
        async function selectOption(optionId, optionName, tagId) {
            const tag = gameTags[currentGameId]?.find(t => t.id == tagId);
            const recordData = { game_id: currentGameId, tag_id: tagId, tag_name: tag ? tag.name : '默认', option_id: optionId, option_name: optionName };
            if (currentUser?.is_guest) { const records = gameRecords[currentGameId] || []; records.unshift({ id: Date.now(), ...recordData, reason: optionName, time: formatDate(new Date().toISOString()), created_at: new Date().toISOString() }); gameRecords[currentGameId] = records; localStorage.setItem(`guest_records_${currentGameId}`, JSON.stringify(records)); renderRecords(); return; }
            await sb.from('records').insert([recordData]);
            await loadCurrentData(); renderRecords();
        }
        
        function renderRecords() {
            const records = gameRecords[currentGameId] || [];
            const recentContainer = document.getElementById('recentRecords');
            const allContainer = document.getElementById('allRecords');
            if (records.length === 0) { recentContainer.innerHTML = '<div class="empty">暂无记录</div>'; allContainer.innerHTML = '<div class="empty">暂无记录</div>'; return; }
            recentContainer.innerHTML = records.slice(0, 10).map(r => `<div class="record"><span class="record-result">${r.reason}</span><span class="record-time">${r.time}</span></div>`).join('');
            allContainer.innerHTML = records.map(r => `<div class="record"><span class="record-result">${r.reason}</span><span class="record-time">${r.time}</span></div>`).join('');
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if (tab === 'record') { document.getElementById('recordTab').style.display = 'block'; document.getElementById('statsTab').style.display = 'none'; }
            else { document.getElementById('recordTab').style.display = 'none'; document.getElementById('statsTab').style.display = 'block'; renderChart(); }
        }
        
        function renderChart() {
            const records = gameRecords[currentGameId] || [];
            if (records.length === 0) { document.getElementById('chartCard').innerHTML = '<div class="section-title">选项分布</div><div class="empty">暂无数据</div>'; return; }
            const stats = {}; records.forEach(r => { stats[r.reason] = (stats[r.reason] || 0) + 1; });
            const ctx = document.getElementById('reasonChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, { type: 'bar', data: { labels: Object.keys(stats), datasets: [{ label: '次数', data: Object.values(stats), backgroundColor: '#007aff', borderRadius: 8 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } } });
        }
        
        async function clearAll() {
            if (currentUser?.is_guest) { localStorage.removeItem(`guest_records_${currentGameId}`); gameRecords[currentGameId] = []; renderRecords(); return; }
            await sb.from('records').delete().eq('game_id', currentGameId);
            await loadCurrentData(); renderRecords();
        }
        
        function showSettings() { document.getElementById('recordTab').classList.add('hidden'); document.getElementById('settingsPage').classList.add('active'); renderTagManager(); }
        function showRecord() { document.getElementById('settingsPage').classList.remove('active'); document.getElementById('recordTab').classList.remove('hidden'); }
        
        function showGameModal() {
            const list = document.getElementById('gameList');
            list.innerHTML = games.map(g => `<div class="game-item ${g.id == currentGameId ? 'active' : ''}" onclick="selectGame(${g.id}, '${g.name}')"><div style="flex:1"><div class="game-item-name">${g.name}</div></div></div>`).join('');
            document.getElementById('gameModal').classList.add('active');
        }
        function closeGameModal() { document.getElementById('gameModal').classList.remove('active'); }
        function selectGame(id, name) { currentGameId = id; currentGameName = name; localStorage.setItem('currentGameId', id); updateGameTitle(); loadCurrentData(); renderTags(); renderRecords(); closeGameModal(); }
        function checkInput() { const input = document.getElementById('newGameInput'); const btn = document.getElementById('addGameBtn'); btn.style.display = input.value.trim() ? 'flex' : 'none'; }
        
        async function addGame() {
            const input = document.getElementById('newGameInput');
            const name = input.value.trim(); if (!name) return;
            const gameData = { name, user_id: currentUser?.is_guest ? 'guest' : currentUser.id };
            if (currentUser?.is_guest) { games.push({ id: Date.now(), ...gameData }); localStorage.setItem('guest_games', JSON.stringify(games)); }
            else { await sb.from('games').insert([gameData]); await loadGames(); }
            input.value = ''; document.getElementById('addGameBtn').style.display = 'none'; showGameModal();
        }
        
        function showConfirm(message, onConfirm) { document.getElementById('confirmMessage').textContent = message; document.getElementById('confirmBtn').onclick = () => { onConfirm(); closeConfirm(); }; document.getElementById('confirmOverlay').classList.add('active'); }
        function closeConfirm() { document.getElementById('confirmOverlay').classList.remove('active'); }
        
        async function checkAuth() {
            try {
                const { data: { session } } = await sb.auth.getSession();
                if (session) { currentUser = session.user; showApp(); } else { showAuth(); }
            } catch(e) { console.error('Auth error:', e); showAuth(); }
        }
        
        // 等 DOM 加载完再执行
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => { checkAuth(); lucide.createIcons(); });
        } else {
            checkAuth();
            lucide.createIcons();
        }
    </script>
</body>
</html>
