<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>项目复盘</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ===== 基础样式 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            padding: 16px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* ===== 登录页面样式 ===== */
        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
        }
        .auth-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .auth-title {
            font-size: 24px;
            font-weight: 700;
            color: #1d1d1f;
            text-align: center;
            margin-bottom: 8px;
        }
        .auth-subtitle {
            font-size: 14px;
            color: #86868b;
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-input {
            width: 100%;
            padding: 14px 16px;
            background: #f5f5f7;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 12px;
        }
        .auth-input:focus {
            outline: none;
            border-color: #007aff;
            background: #fff;
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-bottom: 12px;
        }
        .auth-btn:active { transform: scale(0.98); opacity: 0.8; }
        .auth-btn-primary { background: #007aff; color: #fff; }
        .auth-btn-secondary { background: #f0f0f5; color: #1d1d1f; }
        .auth-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #86868b;
            font-size: 13px;
        }
        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e5;
        }
        .auth-divider span { padding: 0 12px; }
        .auth-toggle {
            text-align: center;
            font-size: 14px;
            color: #86868b;
        }
        .auth-toggle a {
            color: #007aff;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .auth-error {
            background: #ffebeb;
            color: #ff3b30;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
        }
        .auth-success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: center;
        }
        .hidden { display: none !important; }
        
        /* ===== 主应用样式 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            background: #f5f5f7;
            padding: 16px 0;
            z-index: 50;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            position: sticky;
            top: 60px;
            background: #f5f5f7;
            padding: 8px 0;
            z-index: 50;
        }
        .game-selector {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #fff;
            padding: 8px 16px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .game-selector:hover { background: #f0f0f5; }
        .game-title { font-size: 1.1rem; color: #1d1d1f; font-weight: 600; }
        .game-icon { color: #86868b; }
        .settings-btn, .back-btn, .logout-btn { cursor: pointer; padding: 8px; color: #1d1d1f; }
        .settings-btn:hover, .back-btn:hover, .logout-btn:hover { opacity: 0.6; }
        
        /* ===== 卡片和按钮 ===== */
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.98); opacity: 0.8; }
        .btn-primary { background: #007aff; color: #fff; }
        .btn-success { background: #34c759; color: #fff; }
        .btn-danger { background: #ffebeb; color: #ff3b30; }
        .btn-secondary { background: #f0f0f5; color: #1d1d1f; }
        
        /* ===== 选项按钮 ===== */
        .tags { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .option-btn {
            padding: 14px;
            border-radius: 12px;
            background: #f0f0f5;
            color: #1d1d1f;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            text-align: center;
            transition: all 0.2s;
        }
        .option-btn:active { background: #007aff; color: #fff; transform: scale(0.98); }
        
        /* ===== 设置页样式 ===== */
        .tag-manager-item {
            background: #f8f8fa;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .tag-manager-delete {
            background: none;
            color: #ff3b30;
            border: none;
            padding: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tag-manager-delete:hover { opacity: 0.6; }
        
        /* ===== 项目列表样式 ===== */
        .game-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: #f8f8fa;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .game-item:hover { background: #f0f0f5; }
        .game-item.active { background: #007aff; color: #fff; }
        .game-item-name { font-size: 15px; font-weight: 600; }
        .game-item-count { font-size: 12px; opacity: 0.7; margin-top: 2px; }
        .game-item-delete {
            background: #ffebeb;
            color: #ff3b30;
            border: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .game-item-delete:hover { background: #ff3b30; color: #fff; }
        .game-item-copy {
            background: #f0f0f5;
            color: #1d1d1f;
            border: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .game-item-copy:hover { background: #007aff; color: #fff; }
        
        /* ===== 添加项目输入框 ===== */
        .add-game-row { display: flex; gap: 8px; }
        .add-game-input {
            flex: 1;
            padding: 12px 16px;
            background: #f8f8fa;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 14px;
        }
        .add-game-input:focus { outline: none; border-color: #007aff; }
        .add-game-btn {
            padding: 12px;
            background: #007aff;
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* ===== 记录列表样式 ===== */
        .records { max-height: 400px; overflow-y: auto; }
        .records-grid, .records-list { display: flex; flex-direction: column; gap: 8px; }
        .record {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: 10px;
            background: #f8f8fa;
            min-height: 56px;
        }
        .record-result { font-weight: 600; font-size: 14px; line-height: 1.4; }
        .record-time { font-size: 11px; color: #c7c7cc; white-space: nowrap; line-height: 1.4; }
        
        /* ===== 图表样式 ===== */
        .bar-chart { margin-top: 10px; position: relative; height: 250px; }
        
        /* ===== 弹窗样式 ===== */
        .modal-overlay, .confirm-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active, .confirm-overlay.active { display: flex; }
        .modal {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-title { font-size: 18px; font-weight: 600; color: #1d1d1f; margin-bottom: 16px; text-align: center; }
        .game-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .close-modal { margin-top: 16px; background: #f0f0f5; color: #1d1d1f; }
        .confirm-modal {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            width: 90%;
            max-width: 320px;
        }
        .confirm-message { font-size: 15px; color: #1d1d1f; margin-bottom: 20px; text-align: center; }
        .confirm-buttons { display: flex; gap: 12px; }
        .confirm-buttons .btn { flex: 1; }
        
        /* ===== 页面切换 ===== */
        .settings-page { display: none; }
        .settings-page.active { display: block; }
        .record-page.hidden { display: none; }
        
        /* ===== 其他样式 ===== */
        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab.active { background: #007aff; color: #fff; }
        .section-title { font-size: 14px; color: #86868b; margin-bottom: 16px; }
        .empty { text-align: center; padding: 30px; color: #c7c7cc; }
        .icon { width: 20px; height: 20px; }
        .icon-sm { width: 16px; height: 16px; }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #86868b;
        }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div id="authPage" class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">项目复盘</h1>
            <p class="auth-subtitle">登录以同步你的数据</p>
            
            <div id="authError" class="auth-error hidden"></div>
            <div id="authSuccess" class="auth-success hidden"></div>
            
            <!-- 登录表单 -->
            <div id="loginForm">
                <input type="email" id="loginEmail" class="auth-input" placeholder="邮箱" />
                <input type="password" id="loginPassword" class="auth-input" placeholder="密码" />
                <button class="auth-btn auth-btn-primary" onclick="handleLogin()">登录</button>
                <div class="auth-toggle">
                    没有账号？<a onclick="showSignup()">注册</a>
                </div>
            </div>
            
            <!-- 注册表单 -->
            <div id="signupForm" class="hidden">
                <input type="email" id="signupEmail" class="auth-input" placeholder="邮箱" />
                <input type="password" id="signupPassword" class="auth-input" placeholder="密码（至少 6 位）" />
                <button class="auth-btn auth-btn-primary" onclick="handleSignup()">注册</button>
                <div class="auth-toggle">
                    已有账号？<a onclick="showLogin()">登录</a>
                </div>
            </div>
            
            <div class="auth-divider"><span>或</span></div>
            
            <button class="auth-btn auth-btn-secondary" onclick="handleGuestLogin()">
                先随便看看
            </button>
        </div>
    </div>
    
    <!-- 主应用页面 -->
    <div id="appPage" class="container hidden">
        <div class="record-page" id="recordPage">
            <div class="header">
                <div class="settings-btn" onclick="showSettings()">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </div>
                <div class="game-selector" onclick="showGameModal()">
                    <span class="game-title" id="currentGameTitle">项目复盘</span>
                    <svg class="game-icon icon-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="logout-btn" onclick="handleLogout()" title="退出登录">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </div>
            </div>
            
            <div class="tabs">
                <div class="tab active" onclick="switchTab('record')">
                    <svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    记录
                </div>
                <div class="tab" onclick="switchTab('stats')">
                    <svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    统计
                </div>
            </div>
            
            <div id="recordTab">
                <div class="card">
                    <div class="section-title">选择选项</div>
                    <div class="tags" id="optionButtons"></div>
                </div>
                <div class="card">
                    <div class="section-title">最近记录</div>
                    <div class="records" id="recentRecords"></div>
                </div>
            </div>
            
            <div id="statsTab" style="display: none;">
                <div class="card" id="chartCard">
                    <div class="section-title">选项分布</div>
                    <div class="bar-chart">
                        <canvas id="reasonChart"></canvas>
                    </div>
                </div>
                <div class="card">
                    <div class="section-title">全部记录</div>
                    <div class="records" id="allRecords"></div>
                </div>
                <button class="btn btn-danger" onclick="clearAll()">
                    <svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    清空当前项目数据
                </button>
            </div>
        </div>
        
        <!-- 设置页 -->
        <div id="settingsPage" class="settings-page">
            <div class="header">
                <div class="back-btn" onclick="showRecord()">
                    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                </div>
                <div class="title" style="font-size:18px;font-weight:600">设置</div>
                <div style="width: 36px;"></div>
            </div>
            
            <div class="card">
                <div class="section-title">管理选项</div>
                <div id="tagManager"></div>
                <div style="display:flex;gap:8px;margin-top:12px">
                    <input type="text" id="newOptionInput" placeholder="添加选项..." style="flex:1;padding:12px;border:2px solid #e0e0e5;border-radius:10px;font-size:14px" onkeypress="if(event.key==='Enter')addOption(this)" />
                    <button class="btn btn-success" onclick="addOption(document.getElementById('newOptionInput'))" style="padding:12px 20px">添加</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 项目选择弹窗 -->
    <div class="modal-overlay" id="gameModal">
        <div class="modal">
            <div class="modal-title">选择项目</div>
            <div class="game-list" id="gameList"></div>
            <div class="add-game-row">
                <input type="text" class="add-game-input" id="newGameInput" placeholder="输入名称..." oninput="checkInput()" />
                <button class="add-game-btn" onclick="addGame()" id="addGameBtn" style="display:none">
                    <svg class="icon-sm" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </button>
            </div>
            <button class="btn close-modal" onclick="closeGameModal()">关闭</button>
        </div>
    </div>
    
    <!-- 确认弹窗 -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-modal">
            <div class="confirm-message" id="confirmMessage">确定删除？</div>
            <div class="confirm-buttons">
                <button class="btn btn-secondary" onclick="closeConfirm()">取消</button>
                <button class="btn btn-danger" onclick="confirmAction()">删除</button>
            </div>
        </div>
    </div>

    <script>
        // ===== Supabase 配置 =====
        const SUPABASE_URL = 'https://spqyznqviqztsibaghoc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ziV-a2GKKBQgxt1luaO_cQ_iD1OMWOx';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // ===== API 配置 =====
        const API_BASE = 'http://localhost:3003/api';
        
        // ===== 全局数据 =====
        let currentUser = null;
        let games = [];
        let currentGameId = null;
        let currentGameName = '项目复盘';
        let gameTags = {};
        let gameRecords = {};
        let currentTab = 'record';
        let chart = null;
        let confirmCallback = null;
        
        // ===== 认证相关 =====
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            currentUser = session?.user || null;
            
            if (currentUser) {
                showApp();
            } else {
                showAuth();
            }
        }
        
        function showAuth() {
            document.getElementById('authPage').classList.remove('hidden');
            document.getElementById('appPage').classList.add('hidden');
        }
        
        function showApp() {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('appPage').classList.remove('hidden');
            init();
        }
        
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showAuthError('请填写邮箱和密码');
                return;
            }
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                showAuthError(error.message);
            } else {
                currentUser = data.user;
                showAuthSuccess('登录成功！');
                setTimeout(() => showApp(), 500);
            }
        }
        
        async function handleSignup() {
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            
            if (!email || !password) {
                showAuthError('请填写邮箱和密码');
                return;
            }
            
            if (password.length < 6) {
                showAuthError('密码至少 6 位');
                return;
            }
            
            const { data, error } = await supabase.auth.signUp({ email, password });
            
            if (error) {
                showAuthError(error.message);
            } else {
                showAuthSuccess('注册成功！请检查邮箱验证链接');
                setTimeout(() => showLogin(), 2000);
            }
        }
        
        function handleGuestLogin() {
            // 游客模式，使用本地存储
            currentUser = { is_guest: true, id: 'guest' };
            showApp();
        }
        
        async function handleLogout() {
            if (!currentUser?.is_guest) {
                await supabase.auth.signOut();
            }
            currentUser = null;
            showAuth();
        }
        
        function showAuthError(msg) {
            const el = document.getElementById('authError');
            el.textContent = msg;
            el.classList.remove('hidden');
        }
        
        function showAuthSuccess(msg) {
            const el = document.getElementById('authSuccess');
            el.textContent = msg;
            el.classList.remove('hidden');
        }
        
        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('signupForm').classList.add('hidden');
        }
        
        function showSignup() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
        }
        
        // ===== 初始化 =====
        async function init() {
            await loadGames();
            if (games.length === 0) {
                await createDefaultGame();
            } else {
                const savedId = localStorage.getItem('currentGameId');
                const game = games.find(g => g.id == savedId) || games[0];
                currentGameId = game.id;
                currentGameName = game.name;
            }
            updateGameTitle();
            await loadCurrentData();
            renderTags();
            renderRecords();
        }
        
        async function loadGames() {
            const res = await fetch(`${API_BASE}/games`);
            games = await res.json();
        }
        
        async function createDefaultGame() {
            const res = await fetch(`${API_BASE}/games`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: '项目复盘' })
            });
            const game = await res.json();
            currentGameId = game.id;
            currentGameName = game.name;
            await loadGames();
        }
        
        // ===== 数据加载 =====
        async function loadCurrentData() {
            if (!currentGameId) return;
            
            const [tagsRes, recordsRes] = await Promise.all([
                fetch(`${API_BASE}/games/${currentGameId}/tags`),
                fetch(`${API_BASE}/games/${currentGameId}/records?limit=100`)
            ]);
            
            const tags = await tagsRes.json();
            const records = await recordsRes.json();
            
            gameTags[currentGameId] = tags;
            gameRecords[currentGameId] = records.map(r => ({
                id: r.id,
                tag: r.tag_name,
                reason: r.option_name,
                time: formatDate(r.created_at)
            }));
        }
        
        function formatDate(isoString) {
            const d = new Date(isoString);
            const months = ['1 月','2 月','3 月','4 月','5 月','6 月','7 月','8 月','9 月','10 月','11 月','12 月'];
            return `${months[d.getMonth()]}${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }
        
        function updateGameTitle() {
            document.getElementById('currentGameTitle').textContent = currentGameName;
        }
        
        // ===== 选项管理 =====
        function renderTagManager() {
            const tags = gameTags[currentGameId] || [];
            const container = document.getElementById('tagManager');
            
            const allOptions = [];
            tags.forEach(tag => {
                if (tag.options && tag.options.length > 0) {
                    tag.options.forEach(opt => allOptions.push({ id: opt.id, name: opt.name }));
                }
            });
            
            if (allOptions.length === 0) {
                container.innerHTML = '<div style="color:#86868b;padding:20px;text-align:center">暂无选项</div>';
                return;
            }
            
            container.innerHTML = allOptions.map(opt => `
                <div class="tag-manager-item" style="display:flex;align-items:center;justify-content:space-between">
                    <span style="font-weight:500">${opt.name}</span>
                    <button class="tag-manager-delete" onclick="deleteOption(${opt.id})">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                </div>
            `).join('');
        }
        
        async function deleteOption(id) {
            try {
                const res = await fetch(`${API_BASE}/options/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('删除失败');
                await loadCurrentData();
                renderTagManager();
                renderTags();
            } catch (err) {
                alert('删除失败：' + err.message);
            }
        }
        
        async function addOption(input) {
            const value = input.value.trim();
            if (!value) return;
            
            try {
                const tags = gameTags[currentGameId];
                if (tags && tags.length > 0) {
                    const res = await fetch(`${API_BASE}/games/${currentGameId}/options`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            tagName: tags[0].name,
                            optionName: value
                        })
                    });
                    if (!res.ok) throw new Error('添加失败');
                    input.value = '';
                    await loadCurrentData();
                    renderTagManager();
                    renderTags();
                }
            } catch (err) {
                alert('添加失败：' + err.message);
            }
        }
        
        function renderTags() {
            const tags = gameTags[currentGameId] || [];
            const container = document.getElementById('optionButtons');
            
            const allOptions = [];
            tags.forEach(tag => {
                if (tag.options && tag.options.length > 0) {
                    tag.options.forEach(opt => allOptions.push({ tag: tag.name, option: opt.name }));
                }
            });
            
            container.innerHTML = allOptions.map(item => 
                `<button class="option-btn" onclick="saveRecord('${item.tag}', '${item.option}')">${item.option}</button>`
            ).join('');
        }
        
        async function saveRecord(tagName, reason) {
            try {
                const res = await fetch(`${API_BASE}/games/${currentGameId}/records`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tagName, optionName: reason })
                });
                if (!res.ok) throw new Error('保存失败');
                
                const record = await res.json();
                gameRecords[currentGameId].unshift({
                    id: record.id,
                    tag: tagName,
                    reason: reason,
                    time: formatDate(record.created_at)
                });
                
                renderRecords();
                renderTags();
            } catch (err) {
                alert('保存失败：' + err.message);
            }
        }
        
        // ===== 记录渲染 =====
        function renderRecords() {
            const records = gameRecords[currentGameId] || [];
            const recent = records.slice(0, 3);
            document.getElementById('recentRecords').innerHTML = renderRecordList(recent, true);
            document.getElementById('allRecords').innerHTML = renderRecordList(records, false);
            setTimeout(initSwipe, 0);
        }
        
        function renderRecordList(list, isRecent = false) {
            if (list.length === 0) return '<div class="empty">暂无记录</div>';
            const containerClass = isRecent ? 'records-grid' : 'records-list';
            return `<div class="${containerClass}">${list.map(rec => {
                const globalIdx = list.indexOf(rec);
                return `
                <div class="record">
                    <div class="record-info">
                        <div class="record-result">${rec.tag}${rec.reason ? '：' + rec.reason : ''}</div>
                    </div>
                    <div class="record-time">${rec.time}</div>
                </div>
            `;
            }).join('')}</div>`;
        }
        
        // ===== 图表渲染 =====
        async function renderChart() {
            const res = await fetch(`${API_BASE}/games/${currentGameId}/stats`);
            const stats = await res.json();
            
            const sorted = Object.entries(stats)
                .filter(([_, count]) => count > 0)
                .sort((a, b) => b[1] - a[1]);
            
            document.getElementById('chartCard').style.display = sorted.length > 0 ? 'block' : 'none';
            
            if (sorted.length === 0) {
                if (chart) {
                    chart.destroy();
                    chart = null;
                }
                return;
            }
            
            const labels = sorted.map(([name]) => name);
            const data = sorted.map(([_, count]) => count);
            
            if (chart) chart.destroy();
            
            const ctx = document.getElementById('reasonChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '次数',
                        data: data,
                        backgroundColor: [
                            'rgba(255, 59, 48, 0.8)',
                            'rgba(255, 149, 0, 0.8)',
                            'rgba(255, 204, 0, 0.8)',
                            'rgba(52, 199, 89, 0.8)',
                            'rgba(0, 122, 255, 0.8)',
                            'rgba(88, 86, 214, 0.8)',
                            'rgba(175, 82, 222, 0.8)'
                        ],
                        borderColor: [
                            'rgba(255, 59, 48, 1)',
                            'rgba(255, 149, 0, 1)',
                            'rgba(255, 204, 0, 1)',
                            'rgba(52, 199, 89, 1)',
                            'rgba(0, 122, 255, 1)',
                            'rgba(88, 86, 214, 1)',
                            'rgba(175, 82, 222, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        }
        
        // ===== Tab 切换 =====
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            document.getElementById('recordTab').style.display = tab === 'record' ? 'block' : 'none';
            document.getElementById('statsTab').style.display = tab === 'stats' ? 'block' : 'none';
            
            if (tab === 'stats') renderChart();
        }
        
        // ===== 删除记录 =====
        async function delRecord(i, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            
            const records = gameRecords[currentGameId] || [];
            const record = records[i];
            if (!record) return;
            
            try {
                const res = await fetch(`${API_BASE}/records/${record.id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('删除失败');
                records.splice(i, 1);
                renderRecords();
                if (currentTab === 'stats') renderChart();
            } catch (err) {
                alert('删除失败：' + err.message);
            }
        }
        
        // ===== 确认弹窗 =====
        function showConfirm(message, callback) {
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmOverlay').classList.add('active');
            confirmCallback = callback;
        }
        
        function closeConfirm() {
            document.getElementById('confirmOverlay').classList.remove('active');
            confirmCallback = null;
        }
        
        function confirmAction() {
            if (confirmCallback) confirmCallback();
            closeConfirm();
        }
        
        async function clearAll() {
            showConfirm(`清空"${currentGameName}"的数据？`, async () => {
                try {
                    const res = await fetch(`${API_BASE}/games/${currentGameId}/records`, { method: 'DELETE' });
                    if (!res.ok) throw new Error('清空失败');
                    gameRecords[currentGameId] = [];
                    renderRecords();
                    renderChart();
                } catch (err) {
                    alert('清空失败：' + err.message);
                }
            });
        }
        
        // ===== 页面导航 =====
        function showSettings() {
            document.getElementById('recordPage').classList.add('hidden');
            document.getElementById('settingsPage').classList.add('active');
            renderTagManager();
        }
        
        function showRecord() {
            document.getElementById('recordPage').classList.remove('hidden');
            document.getElementById('settingsPage').classList.remove('active');
        }
        
        // ===== 项目管理 =====
        async function showGameModal() {
            await loadGames();
            renderGameList();
            document.getElementById('gameModal').classList.add('active');
        }
        
        function closeGameModal() {
            document.getElementById('gameModal').classList.remove('active');
        }
        
        function checkInput() {
            const input = document.getElementById('newGameInput');
            const addBtn = document.getElementById('addGameBtn');
            addBtn.style.display = input.value.trim().length > 0 ? 'flex' : 'none';
        }
        
        function renderGameList() {
            const list = document.getElementById('gameList');
            list.innerHTML = games.map(game => {
                const count = (gameRecords[game.id] || []).length;
                return `
                    <div class="game-item ${game.id === currentGameId ? 'active' : ''}" onclick="selectGame(${game.id})">
                        <div style="flex:1">
                            <div class="game-item-name">${game.name}</div>
                            <div class="game-item-count">${count} 条记录</div>
                        </div>
                        <div style="display:flex;align-items:center;gap:8px">
                            <button class="game-item-copy" onclick="event.stopPropagation();copyProject(${game.id})" title="复制配置">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            </button>
                            <button class="game-item-delete" onclick="event.stopPropagation();deleteGame(${game.id})">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function selectGame(id) {
            currentGameId = id;
            currentGameName = games.find(g => g.id === id).name;
            localStorage.setItem('currentGameId', id);
            updateGameTitle();
            await loadCurrentData();
            renderTags();
            renderRecords();
            renderChart();
            renderTagManager();
            closeGameModal();
        }
        
        async function addGame() {
            const input = document.getElementById('newGameInput');
            const value = input.value.trim();
            if (!value) return;
            
            try {
                const res = await fetch(`${API_BASE}/games`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: value })
                });
                if (!res.ok) throw new Error('创建失败');
                input.value = '';
                checkInput();
                await loadGames();
                renderGameList();
            } catch (err) {
                alert('创建失败：' + err.message);
            }
        }
        
        function copyProject(id) {
            const game = games.find(g => g.id === id);
            const tags = gameTags[id] || [];
            const config = {
                game: game.name,
                tags: tags.map(t => ({
                    name: t.name,
                    options: t.options.map(o => o.name)
                })),
                version: '4.0'
            };
            const configStr = btoa(encodeURIComponent(JSON.stringify(config)));
            
            const tempInput = document.createElement('textarea');
            tempInput.value = configStr;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            alert('配置已复制到剪贴板');
        }
        
        async function deleteGame(id) {
            if (games.length <= 1) return;
            
            const game = games.find(g => g.id === id);
            showConfirm(`删除"${game.name}"？`, async () => {
                try {
                    const res = await fetch(`${API_BASE}/games/${id}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error('删除失败');
                    await loadGames();
                    
                    if (currentGameId === id) {
                        currentGameId = games[0].id;
                        currentGameName = games[0].name;
                        localStorage.setItem('currentGameId', currentGameId);
                        updateGameTitle();
                        await loadCurrentData();
                        renderTags();
                        renderRecords();
                    }
                    renderGameList();
                } catch (err) {
                    alert('删除失败：' + err.message);
                }
            });
        }
        
        // ===== 滑动删除 =====
        function initSwipe() {
            // 简化版本，暂不实现滑动
        }
        
        // ===== 启动应用 =====
        checkAuth();
    </script>
</body>
</html>
